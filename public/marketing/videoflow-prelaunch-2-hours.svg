<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">VideoFlow pre-launch pricing countdown</title>
  <desc id="desc">T-minus two hours before VideoFlow pre-launch pricing ends.</desc>
  <defs>
    <linearGradient id="bg" x1="74" y1="32" x2="1120" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7f7ff"/>
      <stop offset="1" stop-color="#ece8ff"/>
    </linearGradient>
    <linearGradient id="logo" x1="4" y1="2" x2="72" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#785fff"/>
      <stop offset="1" stop-color="#6247ec"/>
    </linearGradient>
    <linearGradient id="number" x1="355" y1="420" x2="820" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#806cff"/>
      <stop offset="1" stop-color="#5e46e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="38" flood-color="#4a3da6" flood-opacity="0.14"/>
    </filter>
    <filter id="numberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6d5bfc" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <path d="M820 0h380v390c-93 18-187 67-282 145-76 63-141 85-196 68C835 491 868 290 820 0Z" fill="#ece8ff" opacity="0.72"/>
  <path d="M0 916c169 76 315 112 464 69 161-46 309-27 449 52 104 58 200 84 287 77v86H0Z" fill="#ddd7ff" opacity="0.72"/>
  <path d="M0 999c160 61 311 71 454 31 149-41 288-22 424 54 117 65 224 86 322 63v53H0Z" fill="#c7beff" opacity="0.64"/>

  <g transform="translate(70 56)">
    <rect width="76" height="76" rx="21" fill="url(#logo)"/>
    <path d="M18 41c4.5 0 5.5-12 10.3-12s5.6 18 10.8 18c4.8 0 5.6-18 10.6-18 4.3 0 5.4 12 9.3 12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="164" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-2.2" fill="#15172b">Video<tspan fill="#6d5bfc">Flow</tspan></text>

  <g filter="url(#cardShadow)">
    <rect x="70" y="186" width="1060" height="848" rx="48" fill="#ffffff" stroke="#e5e1ff" stroke-width="2"/>
  </g>

  <rect x="405" y="238" width="390" height="54" rx="27" fill="#f0eeff"/>
  <text x="612" y="274" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="3.4" fill="#6d5bfc">PRE-LAUNCH COUNTDOWN</text>

  <text x="600" y="400" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="8" fill="#15172b">T–MINUS</text>

  <g opacity="0.9" stroke="#d9d3ff" stroke-width="6" stroke-linecap="round">
    <path d="M278 550h40"/><path d="M289 499l36 17"/><path d="M322 455l28 29"/>
    <path d="M922 550h-40"/><path d="M911 499l-36 17"/><path d="M878 455l-28 29"/>
    <path d="M278 696h40"/><path d="M289 747l36-17"/><path d="M322 791l28-29"/>
    <path d="M922 696h-40"/><path d="M911 747l-36-17"/><path d="M878 791l-28-29"/>
  </g>

  <text x="470" y="735" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="360" font-weight="700" letter-spacing="-22" fill="url(#number)" filter="url(#numberGlow)">2</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#15172b">
    <text x="650" y="612" font-size="88" font-weight="700" letter-spacing="-4">HOURS</text>
    <text x="654" y="671" font-size="25" font-weight="700" letter-spacing="5.5" fill="#77809a">REMAINING</text>
  </g>

  <path d="M270 824H930" stroke="#eceaf5" stroke-width="2"/>
  <text x="600" y="896" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.6" fill="#15172b">PRE-LAUNCH PRICING ENDS</text>
  <text x="600" y="947" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="-0.4" fill="#687189">Last chance to lock it in.</text>

  <rect x="340" y="1060" width="520" height="78" rx="39" fill="#15172b"/>
  <text x="600" y="1110" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2.8" fill="#ffffff">OWN YOUR VIDEO STACK →</text>
</svg>
