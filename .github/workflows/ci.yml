name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Uses the Node release pinned in .nvmrc (22.23.1), matching package.json engines.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # AGENTS.md: never commit .env files or provider credentials.
      # Fails the build if anything but .env.example is ever tracked.
      - name: Guard against committed environment files
        run: |
          tracked="$(git ls-files -- '.env*' ':!:.env.example')"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked environment file(s) detected — remove them and rotate any exposed credentials:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files besides .env.example."

      # The required validation suite from docs/AI_SETUP_ASSISTANT.md.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Test mode bypasses ClerkProvider (components/providers/app-provider.tsx),
      # and lib/config.ts falls back for every other value, so the build needs no secrets.
      - run: npm run build
        env:
          NEXT_PUBLIC_TEST_MODE: "true"

      # Gated at "high" on purpose: package.json pins postcss 8.5.18 via overrides,
      # which currently leaves 2 moderate advisories that no lockfile change can clear.
      # Raise this to --audit-level=moderate once that pin is revisited.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
